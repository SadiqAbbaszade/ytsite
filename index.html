<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>YouTube Rakip Kanal Sıralama</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
      color: #fff;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .add-channel {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .add-channel input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 14px;
    }

    .add-channel button {
      padding: 12px 18px;
      border-radius: 8px;
      border: none;
      background: #1db954;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .channel {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px;
      margin-bottom: 12px;
      border-radius: 14px;
      cursor: grab;
    }

    .number {
      font-size: 20px;
      font-weight: bold;
      width: 30px;
      text-align: center;
    }

    .logo {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
    }

    .info {
      flex: 1;
    }

    .info .name {
      font-size: 16px;
      font-weight: bold;
    }

    .info .subs {
      font-size: 13px;
      opacity: 0.85;
    }

    .colors select {
      background: #111;
      color: #fff;
      border: none;
      padding: 6px 8px;
      border-radius: 6px;
      margin-right: 8px;
    }

    .delete-btn {
      background: #000;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 12px;
    }

    .delete-btn:hover {
      background: rgba(255,255,255,0.1);
    }

    .green {
      background: linear-gradient(135deg, #00ff88, #00cc66);
      box-shadow: 0 0 15px rgba(0,255,136,0.6);
    }

    .red {
      background: linear-gradient(135deg, #ff4444, #cc0000);
      box-shadow: 0 0 15px rgba(255,68,68,0.6);
    }

    .yellow {
      background: linear-gradient(135deg, #ffee00, #ffcc00);
      color: #000;
      box-shadow: 0 0 15px rgba(255,238,0,0.7);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Rakip Kanal Sıralaması</h1>

    <div class="add-channel">
      <input id="channelLink" type="text" placeholder="YouTube kanal linkini yapıştır" />
      <button id="addBtn">Ekle</button>
    </div>

    <ul id="channelList"></ul>
  </div>

  <script type="module">
    // ================= FIREBASE =================
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      deleteDoc,
      doc,
      updateDoc,
      onSnapshot,
      query,
      orderBy
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBy7DShn5TQQMEyPitUZ-9A-o6u0EgD08o",
      authDomain: "yt-sayt.firebaseapp.com",
      projectId: "yt-sayt",
      storageBucket: "yt-sayt.firebasestorage.app",
      messagingSenderId: "614904562607",
      appId: "1:614904562607:web:f352a57fe3f4457077e55a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const channelsRef = collection(db, "channels");

    // ================= YOUTUBE API =================
    const API_KEY = 'AIzaSyCtw_vK-v4WFXqhoKLmimhFNHoQgJ6r48g';

    let draggedItem = null;

    async function extractChannelId(url) {
      const channelMatch = url.match(/channel\/([A-Za-z0-9_-]+)/);
      if (channelMatch) return channelMatch[1];

      const handleMatch = url.match(/@([A-Za-z0-9._-]+)/);
      if (handleMatch) {
        const username = handleMatch[1];
        const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=channel&q=${username}&key=${API_KEY}`);
        const json = await res.json();
        if (json.items && json.items.length > 0) {
          return json.items[0].snippet.channelId;
        }
      }
      return null;
    }

    async function fetchChannelData(channelId) {
      const res = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&id=${channelId}&key=${API_KEY}`);
      const json = await res.json();
      const ch = json.items[0];

      return {
        channelId,
        name: ch.snippet.title,
        logo: ch.snippet.thumbnails.high.url,
        subs: Number(ch.statistics.subscriberCount),
      };
    }

    // ================= UI & FIRESTORE =================
    window.addChannel = async function addChannel() {
      const link = document.getElementById('channelLink').value.trim();
      if (!link) return;

      const channelId = await extractChannelId(link);
      if (!channelId) return alert('Geçerli bir YouTube linki gir');

      const data = await fetchChannelData(channelId);

      await addDoc(channelsRef, {
        ...data,
        color: 'green',
        order: Date.now()
      });

      document.getElementById('channelLink').value = '';
    }

    function renderChannel(docSnap) {
      const data = docSnap.data();
      const li = document.createElement('li');
      li.className = `channel ${data.color}`;
      li.draggable = true;
      li.dataset.id = docSnap.id;

      li.innerHTML = `
        <div class="number"></div>
        <img class="logo" src="${data.logo}" />
        <div class="info">
          <div class="name">${data.name}</div>
          <div class="subs">${data.subs.toLocaleString('tr-TR')} abone</div>
        </div>
        <div class="colors">
          <select>
            <option value="green" ${data.color==='green'?'selected':''}>Yeşil</option>
            <option value="red" ${data.color==='red'?'selected':''}>Kırmızı</option>
            <option value="yellow" ${data.color==='yellow'?'selected':''}>Sarı</option>
          </select>
          <button class="delete-btn">Sil</button>
        </div>
      `;

      li.querySelector('select').onchange = async e => {
        await updateDoc(doc(db, 'channels', docSnap.id), { color: e.target.value });
      };

      li.querySelector('.delete-btn').onclick = async () => {
        await deleteDoc(doc(db, 'channels', docSnap.id));
      };

      addDragEvents(li);
      return li;
    }

    function addDragEvents(item) {
      item.addEventListener('dragstart', () => draggedItem = item);
      item.addEventListener('dragover', e => e.preventDefault());
      item.addEventListener('drop', async () => {
        if (draggedItem && draggedItem !== item) {
          const list = document.getElementById('channelList');
          list.insertBefore(draggedItem, item);

          [...list.children].forEach(async (el, index) => {
            await updateDoc(doc(db, 'channels', el.dataset.id), { order: index });
          });
        }
      });
    }

    // ================= REALTIME LISTENER =================
    document.getElementById('addBtn').addEventListener('click', addChannel);

    const q = query(channelsRef, orderBy('order'));
    onSnapshot(q, snapshot => {
      const list = document.getElementById('channelList');
      list.innerHTML = '';
      snapshot.forEach(docSnap => {
        list.appendChild(renderChannel(docSnap));
      });

      [...list.children].forEach((item, index) => {
        item.querySelector('.number').innerText = index + 1;
      });
    });
  </script>
</body>
</html>
